# /etc/nginx/conf.d/pfd-editor.conf
# PFD Editor 前置反向代理 —— 评估-服务器侧可承接条目 · A 项
#   一次性关闭：性能 §1.2(零压缩) / §1.1(零缓存头) / §3.4(无限流) / API契约 §2.1(实时接口不禁缓存)
# 上游：127.0.0.1:18090（docker-compose 将容器 8090 映射到该本机端口）

# ---- 限流 zone（http 上下文，必须放 server 外）----
limit_req_zone  $binary_remote_addr zone=pfd_api:10m      rate=20r/s;   # 实时接口
limit_req_zone  $binary_remote_addr zone=pfd_projects:10m rate=10r/s;   # 项目库（含写删，更严）
limit_conn_zone $binary_remote_addr zone=pfd_conn:10m;

upstream pfd_editor {
    server 127.0.0.1:18090;
    keepalive 32;
}

server {
    listen 8090;
    server_name _;

    # ---- gzip 压缩：静态文本 ~750KB → ~180KB（性能 §1.2）----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json text/xml application/xml image/svg+xml;

    # ---- 全局并发连接上限（性能 §3.4）----
    limit_conn pfd_conn 50;

    # ---- 反代基础头：重写 X-Forwarded-*，不信任客户端传入（安全审计 §4.3）----
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # ---- 实时传感器接口：禁缓存 + 限流（API 契约 §2.1）----
    location ^~ /api/ {
        limit_req zone=pfd_api burst=40 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_pass http://pfd_editor;
    }

    # ---- 项目库接口：禁缓存 + 限流（动态 JSON，含写删）----
    location ^~ /pfd-api/ {
        limit_req zone=pfd_projects burst=20 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_pass http://pfd_editor;
    }

    # ---- 健康/就绪探针：禁缓存 ----
    location ^~ /healthz {
        add_header Cache-Control "no-store" always;
        proxy_pass http://pfd_editor;
    }
    location ^~ /readyz {
        add_header Cache-Control "no-store" always;
        proxy_pass http://pfd_editor;
    }

    # ---- 静态资源：长缓存 + etag（前端以 ?v= 时间戳破除缓存，长缓存不破坏正确性）----
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        etag on;
        proxy_pass http://pfd_editor;
    }

    # ---- 其余（HTML 等）：no-cache —— HTML 含服务端令牌注入，绝不可缓存 ----
    location / {
        add_header Cache-Control "no-cache" always;
        proxy_pass http://pfd_editor;
    }
}
