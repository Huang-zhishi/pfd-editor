# ============================================================
# PFD Editor · CD
#   构建 Docker 镜像并推送到 GitHub Container Registry (GHCR)
#   - push 到 main        -> 标签 latest + <短 SHA>
#   - push 到 v* tag      -> 标签 <tag 名> + <短 SHA>
#   - 手动 workflow_dispatch
# 使用前：仓库 Settings → Actions → General → Workflow permissions
#        选择 "Read and write permissions"（以便 GITHUB_TOKEN 推送镜像）
# ============================================================
name: Build & Push (CD)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & push Docker image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR 镜像名必须全小写；owner 名含大写时需转换
      - name: Compute image name and tags
        id: tags
        run: |
          OWNER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/pfd-editor"
          TAGS="${IMAGE}:${GITHUB_SHA::12}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAGS="${TAGS},${IMAGE}:${{ github.ref_name }}"
          fi
          if [ "${{ github.ref_name }}" = "main" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Pushing tags: ${TAGS}"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # 审计 8.7：生成 SBOM 与构建溯源（BuildKit attestation），
          # 让产物可追溯、可验证来源。镜像签名（cosign）需额外密钥，见 README 部署章节。
          sbom: true
          provenance: true
