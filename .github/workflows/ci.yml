# ============================================================
# PFD Editor · CI
#   - JS 语法检查（node --check）
#   - 启动 server.js 的冒烟测试（静态页面 / 项目库 API 回路）
#   - 验证 Dockerfile 可构建
# 触发：push 到 main / 所有 pull request
# ============================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (syntax + smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Syntax check (node --check)
        run: |
          for f in server.js editor.js templates.js; do
            node --check "$f"
            echo "OK  $f"
          done

      - name: Template render check
        # 审计 1.4/2.1：模板渲染回归 —— 清单与注册一致性 + NaN/undefined 扫描。
        # 脚本随仓库提供（.github/scripts/render-check.js），不依赖外部目录。
        run: node .github/scripts/render-check.js .

      - name: Smoke test (serve + curl)
        env:
          PORT: 18090
          PFD_PROJECT_MAX_BYTES: "1000"
        run: |
          # 必须 export：裸赋值不会传给子进程，node 会退回默认端口 8090
          export PROJECT_DIR="$(mktemp -d)"
          node server.js >/tmp/pfd-server.log 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT

          # 等待服务就绪（最长 30s）
          ready=''
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${PORT}/editor" >/dev/null 2>&1 && { ready=1; break; }
            sleep 1
          done
          [ -n "$ready" ] || { echo "FAIL: server not ready on port ${PORT}"; cat /tmp/pfd-server.log; exit 1; }

          set -e
          echo "== static endpoints =="
          for path in /editor /preview /embed-demo.html /pfd-api/projects; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}${path}")
            echo "${path} -> ${code}"
            [ "${code}" = "200" ] || { echo "FAIL: ${path}"; exit 1; }
          done

          echo "== /projects must be hidden (403) =="
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/projects")
          echo "/projects -> ${code}"
          [ "${code}" = "403" ]

          echo "== projects API round-trip =="
          curl -fsS -X POST "http://127.0.0.1:${PORT}/pfd-api/projects/ci-test.json" \
            -H 'Content-Type: application/json' \
            -d '{"version":1,"components":[],"pipes":[],"meta":{"title":"ci"}}' >/dev/null
          curl -fsS "http://127.0.0.1:${PORT}/pfd-api/projects/ci-test.json" | grep -q '"success":true'
          curl -fsS -X DELETE "http://127.0.0.1:${PORT}/pfd-api/projects/ci-test.json" >/dev/null
          echo "projects API round-trip OK"

          # ---- 健康检查端点（工程化审计 §7.2 / Docker HEALTHCHECK 依赖）----
          echo "== health endpoints =="
          curl -fsS "http://127.0.0.1:${PORT}/healthz" | grep -q '"ok":true' || { echo "FAIL: /healthz"; exit 1; }
          curl -fsS "http://127.0.0.1:${PORT}/readyz"  | grep -q '"ok":true' || { echo "FAIL: /readyz"; exit 1; }
          echo "health endpoints OK"

          # ---- 并发写保护（安全审计 §3.3）----
          echo "== optimistic write lock =="
          curl -fsS -X POST "http://127.0.0.1:${PORT}/pfd-api/projects/ci-lock.json" \
            -H 'Content-Type: application/json' \
            -d '{"version":1,"components":[],"pipes":[],"meta":{}}' >/dev/null
          base=$(curl -fsS "http://127.0.0.1:${PORT}/pfd-api/projects/ci-lock.json" | sed -n 's/.*"mtime":\([0-9.]*\).*/\1/p')
          [ -n "$base" ] || { echo "FAIL: GET 未返回 mtime"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:${PORT}/pfd-api/projects/ci-lock.json" \
            -H 'Content-Type: application/json' -H "X-PFD-Base-Mtime: ${base}" \
            -d '{"version":1,"components":[],"pipes":[],"meta":{}}')
          [ "$code" = "200" ] || { echo "FAIL: 正确基线应 200，实际 $code"; exit 1; }
          stale=$(awk -v b="$base" 'BEGIN{printf "%d", b-5000}')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:${PORT}/pfd-api/projects/ci-lock.json" \
            -H 'Content-Type: application/json' -H "X-PFD-Base-Mtime: ${stale}" \
            -d '{"version":1,"components":[],"pipes":[],"meta":{}}')
          [ "$code" = "409" ] || { echo "FAIL: 过期基线应 409，实际 $code"; exit 1; }
          curl -fsS -X DELETE "http://127.0.0.1:${PORT}/pfd-api/projects/ci-lock.json" >/dev/null
          echo "optimistic write lock OK"

          # ---- 结构化日志（安全审计 §9.4）----
          echo "== structured logs =="
          grep -q '"event":"audit"' /tmp/pfd-server.log || { echo "FAIL: 缺少审计日志"; exit 1; }
          echo "structured logs OK"

          # ---- 请求体上限 413（安全审计 §2.3，上限已由 env 调成 1000 字节）----
          echo "== request body limit =="
          head -c 5000 /dev/zero | tr '\0' 'x' > /tmp/ci-big.json
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:${PORT}/pfd-api/projects/ci-big.json" \
            -H 'Content-Type: application/json' --data-binary @/tmp/ci-big.json)
          echo "  5000 bytes (limit 1000) -> ${code}"
          [ "$code" = "413" ] || { echo "FAIL: 超限应返回 413，实际 $code"; exit 1; }
          echo "body limit OK"

          # ---- 列表不暴露服务器路径（安全审计 §7.3）----
          curl -fsS "http://127.0.0.1:${PORT}/pfd-api/projects" | grep -q '"dir"' \
            && { echo "FAIL: 列表不应回显 dir"; exit 1; }
          echo "no dir field OK"

          # ---- 安全回归（对应安全审计 §1.1/§1.3）----
          # 注意：原来这里只断言 /projects 返回 403，但越界路径可以绕过它，用例通过 ≠ 防护有效
          echo "== path traversal must be rejected =="
          for evil in "/%2e%2e%2fpackage.json" "/%2e%2e%2f%2e%2e%2fetc%2fpasswd" "/../README.md" "/..%2fprojects%2fci-test.json"; do
            code=$(curl -s --path-as-is -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}${evil}")
            echo "  ${evil} -> ${code}"
            case "${code}" in
              403|404) ;;
              *) echo "FAIL: 越界路径未被拒绝（${evil} -> ${code}）"; exit 1 ;;
            esac
          done

          # ---- 安全回归（对应安全审计 §2.1/§2.2）----
          echo "== malformed URI must not kill the server =="
          code=$(curl -s --path-as-is -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/%" || true)
          echo "  GET /% -> ${code}（期望 400）"
          [ "${code}" = "400" ] || { echo "FAIL: 畸形 URI 未返回 400"; exit 1; }
          curl -fsS "http://127.0.0.1:${PORT}/editor" >/dev/null \
            || { echo "FAIL: 服务被畸形 URI 打死（后续请求失败）"; exit 1; }
          echo "  server still alive after malformed URI"

          # ---- 默认监听地址（对应安全审计 §3.2）----
          grep -q '仅本机' /tmp/pfd-server.log \
            || { echo "FAIL: 未设置 HOST 时应默认仅监听 127.0.0.1"; cat /tmp/pfd-server.log; exit 1; }
          echo "default bind is loopback-only"

          # ---- 安全响应头（对应安全审计 §6.1/§6.2）----
          echo "== security headers =="
          hdr=$(curl -s -D - -o /dev/null "http://127.0.0.1:${PORT}/editor")
          for h in "X-Content-Type-Options: nosniff" "Referrer-Policy: no-referrer" "Content-Security-Policy:" "X-Frame-Options: SAMEORIGIN"; do
            echo "$hdr" | grep -qi "$h" || { echo "FAIL: 缺少响应头 ${h}"; exit 1; }
          done
          echo "security headers OK"

          # ---- CORS 默认不开放（对应安全审计 §4.2）----
          echo "== CORS must be closed by default =="
          acao=$(curl -s -D - -o /dev/null -H 'Origin: https://evil.example' "http://127.0.0.1:${PORT}/editor" | grep -i '^access-control-allow-origin' || true)
          [ -z "$acao" ] || { echo "FAIL: 默认不应回 CORS 头，实际：$acao"; exit 1; }
          echo "no ACAO by default OK"

          # ---- 前端安全守卫（对应安全审计 §5.3/§5.5/§5.6）----
          # 这几处是前端行为，curl 覆盖不到，用静态守卫防止被误删/回退
          echo "== frontend security guards =="
          grep -q 'originAllowed(e.origin)' preview.html \
            || { echo "FAIL: postMessage 缺少来源校验（审计 5.3）"; exit 1; }
          grep -q 'isUsableDoc' preview.html \
            || { echo "FAIL: ?doc= 缺少结构校验（审计 5.5）"; exit 1; }
          grep -q '__PFD_API_ALLOW' editor.js \
            || { echo "FAIL: ?api= 缺少跨源白名单校验（审计 5.6）"; exit 1; }
          grep -q "__PFD_EMBED_ORIGINS" server.js \
            || { echo "FAIL: 服务端未注入嵌入来源白名单"; exit 1; }
          echo "frontend guards OK"

      - name: Server log on failure
        if: failure()
        run: cat /tmp/pfd-server.log

  auth-regression:
    name: Auth regression (PFD_API_TOKEN)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # 对应安全审计 §3.1：启用令牌后项目库接口必须 401，带正确令牌才放行
      - name: Token enforcement
        env:
          PORT: 18091
          PFD_API_TOKEN: ci-token-123
        run: |
          export PROJECT_DIR="$(mktemp -d)"
          node server.js >/tmp/pfd-auth.log 2>&1 &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT

          ready=''
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${PORT}/editor" >/dev/null 2>&1 && { ready=1; break; }
            sleep 1
          done
          [ -n "$ready" ] || { echo "FAIL: server not ready"; cat /tmp/pfd-auth.log; exit 1; }

          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}/pfd-api/projects")
          echo "无令牌 -> ${code}（期望 401）"
          [ "${code}" = "401" ] || { echo "FAIL: 无令牌未被拒绝"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-PFD-Token: wrong-token' "http://127.0.0.1:${PORT}/pfd-api/projects")
          echo "错误令牌 -> ${code}（期望 401）"
          [ "${code}" = "401" ] || { echo "FAIL: 错误令牌未被拒绝"; exit 1; }

          curl -fsS -H 'X-PFD-Token: ci-token-123' "http://127.0.0.1:${PORT}/pfd-api/projects" | grep -q '"success":true' \
            || { echo "FAIL: 正确令牌被拒绝"; exit 1; }
          echo "令牌鉴权 OK"

          # 令牌应被注入到 HTML 页面（前端据此自动携带，无需人工配置）
          curl -fsS "http://127.0.0.1:${PORT}/editor" | grep -q '__PFD_TOKEN' \
            || { echo "FAIL: 令牌未注入 HTML 页面"; exit 1; }
          echo "令牌注入 OK"

  proxy-regression:
    name: Proxy regression (prefix / headers / timeout / body limit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      # 对应安全审计 §4.1/§4.3/§4.4：用假上游回显收到的请求头，验证代理收敛行为
      - name: Proxy hardening
        env:
          PORT: 18092
          API_TARGET: http://127.0.0.1:19001
          PFD_PROXY_TIMEOUT_MS: "1500"
          PFD_API_MAX_BYTES: "1000"
        run: |
          cat > /tmp/upstream.js <<'JS'
          const http = require('http');
          http.createServer((req, res) => {
            if (req.url.startsWith('/api/slow')) return;   // 故意挂起，用于测超时
            res.writeHead(200, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify({ path: req.url, headers: req.headers }));
          }).listen(19001, '127.0.0.1');
          JS
          node /tmp/upstream.js &
          UP=$!
          export PROJECT_DIR="$(mktemp -d)"
          node server.js >/tmp/pfd-proxy.log 2>&1 &
          SRV=$!
          trap 'kill "$UP" "$SRV" 2>/dev/null || true' EXIT

          ready=''
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:${PORT}/editor" >/dev/null 2>&1 && { ready=1; break; }
            sleep 1
          done
          [ -n "$ready" ] || { echo "FAIL: server not ready"; cat /tmp/pfd-proxy.log; exit 1; }

          set -e
          echo "== /api/ prefix escape must be rejected (audit 4.1) =="
          for evil in "/api/../editor" "/api/%2e%2e/editor" "/api/..%2fadmin"; do
            code=$(curl -s --path-as-is -o /dev/null -w '%{http_code}' "http://127.0.0.1:${PORT}${evil}")
            echo "  ${evil} -> ${code}"
            [ "${code}" = "400" ] || { echo "FAIL: prefix escape not rejected"; exit 1; }
          done

          echo "== forward header allowlist (audit 4.3) =="
          body=$(curl -fsS -H 'Cookie: secret=abc' -H 'Authorization: Bearer T' -H 'X-Forwarded-For: 1.2.3.4' "http://127.0.0.1:${PORT}/api/echo")
          for h in cookie authorization x-forwarded-for; do
            if echo "$body" | grep -qi "\"$h\""; then echo "FAIL: $h must not be forwarded"; exit 1; fi
          done
          echo "  cookie / authorization / x-forwarded-for not forwarded OK"

          echo "== upstream timeout (audit 4.4) =="
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:${PORT}/api/slow")
          echo "  /api/slow -> ${code} (expect 502)"
          [ "${code}" = "502" ] || { echo "FAIL: upstream timeout not enforced"; exit 1; }

          echo "== request body limit (audit 4.4) =="
          head -c 5000 /dev/zero | tr '\0' 'x' > /tmp/big.txt
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data-binary @/tmp/big.txt "http://127.0.0.1:${PORT}/api/echo")
          echo "  5000 bytes (limit 1000) -> ${code} (expect 413)"
          [ "${code}" = "413" ] || { echo "FAIL: body limit not enforced"; exit 1; }

      - name: Server log on failure
        if: failure()
        run: cat /tmp/pfd-proxy.log

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image
        run: docker build -t pfd-editor:ci .
