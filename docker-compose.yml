# PFD Editor · docker compose 部署
# 用法：docker compose up -d --build
services:
  pfd-editor:
    build: .
    image: pfd-editor:latest
    container_name: pfd-editor
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      PORT: "${PORT:-8090}"
      # server.js 默认只监听 127.0.0.1；容器内需监听 0.0.0.0 才能被映射访问
      HOST: "${HOST:-0.0.0.0}"
      # 项目库接口鉴权令牌（留空=不鉴权）。对外暴露时强烈建议在 .env 中设置
      #   .env 已被 .gitignore 忽略，令牌不会入库；未设置时保持向后兼容（不鉴权）。
      PFD_API_TOKEN: "${PFD_API_TOKEN:-}"
      # 后端传感器 API 地址（/api/* 转发目标）。审计 8.3：不再有默认值，必须显式提供
      API_TARGET: "${API_TARGET:-http://192.168.1.78}"
    volumes:
      # 项目库持久化（命名卷由镜像内 /app/projects 初始化，自动继承 pfd 用户属主，容器重建不丢数据）
      - pfd-projects:/app/projects

    # 审计 8.2：健康检查（与镜像内 HEALTHCHECK 一致）
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # 审计 3.6：资源上限 —— 防止单个容器耗尽宿主机资源（原配置无任何限制）
    #   本项目是单进程 Node 服务，0.5 CPU / 256M 已足够；按实际负载调整。
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    # 审计 8.4：容器加固 —— 去掉全部 capability、根文件系统只读（projects 卷可写）
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp

    # 审计 9.x/7.1：日志留存与轮转 —— json-file 驱动默认无上限，会无限增长
    #   容器日志不落 journald，这里用 docker 侧轮转（等价于 T3 的 journald 部分）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pfd-projects:
